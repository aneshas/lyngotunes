name: LyngoTunes
options:
  bundleIdPrefix: io.anes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  LyngoCore:
    path: Packages/LyngoCore

targets:
  LyngoTunes:
    type: application
    platform: iOS
    sources:
      - path: LyngoTunes
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: LyngoCore
    # Bundle id and signing team live in Config/ so nobody's team id is in the repo.
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: LyngoTunes/Resources/Info.plist
      properties:
        CFBundleDisplayName: LyngoTunes
        UILaunchScreen: {UIColorName: LaunchBackground}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: LyngoTunes
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal

  LyngoTunesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - LyngoTunesUITests
    dependencies:
      - target: LyngoTunes
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: LyngoTunes
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LyngoTunes:
    build:
      targets:
        LyngoTunes: all
        LyngoTunesUITests: [test]
    run:
      config: Debug
      # Debug-only switches (see LyngoTunes/App/DebugFlags.swift). Tick one in
      # Product > Scheme > Edit Scheme > Run > Arguments to use it.
      environmentVariables:
        - variable: LYNGO_DEMO
          value: "1"
          isEnabled: false
        - variable: LYNGO_STATE
          value: "notrack"
          isEnabled: false
        - variable: LYNGO_SETTINGS
          value: "1"
          isEnabled: false
        - variable: LYNGO_DEMO_START
          value: "20000"
          isEnabled: false
        - variable: LYNGO_DEMO_PAUSED
          value: "1"
          isEnabled: false
        - variable: LYNGO_DEMO_TRANSLATE_SECONDS
          value: "8"
          isEnabled: false
    test:
      config: Debug
      targets:
        - package: LyngoCore/LyngoCoreTests
        - LyngoTunesUITests
